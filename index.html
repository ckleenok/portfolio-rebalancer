<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Rebalancer</title>
    <link rel="stylesheet" href="./styles.css?v=20260426-12" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">6-month rebalance plan</p>
          <h1>포트폴리오 리밸런싱</h1>
        </div>
        <button id="loadSheetButton" class="ghost-button" type="button" title="Google Sheet에서 최신 행 불러오기">
          시트 불러오기
        </button>
      </section>

      <section class="summary-grid" aria-label="요약">
        <div class="metric">
          <span>신규 투자금</span>
          <label class="metric-input">
            <input id="contributionMetricInput" type="text" inputmode="numeric" value="400" />
            <span>만원</span>
          </label>
        </div>
        <div class="metric">
          <span>현재 평가금</span>
          <strong id="currentMetric">0만원</strong>
        </div>
        <div class="metric">
          <span>매수 후 총액</span>
          <strong id="futureMetric">0만원</strong>
        </div>
        <div class="metric">
          <span>목표 도달</span>
          <strong id="shortMetric">-</strong>
        </div>
      </section>

      <section class="workbench">
        <div class="panel inputs-panel">
          <div class="panel-title">
            <h2>현재 보유금액</h2>
            <span id="sheetStatus">기본값: 2026-04-16 시트 히스토리</span>
          </div>

          <label class="cash-input">
            <span>이번 달 신규 투자금</span>
            <div class="input-unit">
              <input id="contributionInput" type="text" inputmode="numeric" value="400" />
              <span>만원</span>
            </div>
          </label>

          <div id="assetInputs" class="asset-inputs"></div>
        </div>

        <div class="panel result-panel">
          <div class="panel-title">
            <h2>이번 달 거래</h2>
            <span>6개월에 걸쳐 점진 조정</span>
          </div>
          <div id="buyList" class="buy-list"></div>
          <div id="warningBox" class="warning" hidden></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>비중 변화</h2>
          <span>목표 GLD 41 / SCHD 7 / SPY 22 / QQQ 30</span>
        </div>
        <div id="allocationRows" class="allocation-rows"></div>
      </section>

      <section class="panel cagr-panel">
        <div class="panel-title">
          <h2>예상 CAGR</h2>
          <span id="historyStatus">자산별 CAGR 가정의 비중 가중평균</span>
        </div>
        <button id="loadHistoryButton" class="ghost-button inline-button" type="button">
          최근 120개월 실제 데이터 반영
        </button>
        <div class="cagr-grid">
          <div class="cagr-metric">
            <span>현재 포트폴리오</span>
            <strong id="currentCagr">0.0%</strong>
          </div>
          <div class="cagr-metric">
            <span>1개월차 거래 후</span>
            <strong id="monthOneCagr">0.0%</strong>
          </div>
          <div class="cagr-metric">
            <span>목표 포트폴리오</span>
            <strong id="targetCagr">0.0%</strong>
          </div>
        </div>
      </section>

      <section class="panel simulator-panel">
        <div class="panel-title">
          <h2>월별 시뮬레이터</h2>
          <span id="simulationSummary">계산 중</span>
        </div>
        <div id="simulationList" class="simulation-list"></div>
      </section>
    </main>

    <script src="./app.js?v=20260426-12"></script>
  </body>
</html>
